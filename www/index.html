<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aufgaben</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#2563eb;--ln:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#e8ebef;--mut:#9aa4b2;--ac:#6ea0ff;--ln:#2a313b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--ln)}
#clock{font-size:1.5rem;font-weight:600}
#wx{color:var(--mut)}
.ticker{overflow:hidden;white-space:nowrap;padding:10px 0}
.ticker span{display:inline-block;padding-left:100%;animation:run 120s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
#quote{font-style:italic}
h2{font-size:1rem;margin:0 0 10px}
.add{display:flex;gap:8px;margin-bottom:10px}
input[type=text]{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:1rem}
button{border:0;border-radius:10px;background:var(--ac);color:#fff;padding:10px 14px;font-size:1rem}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln);list-style:none}
ul{margin:0;padding:0}
li.done label{text-decoration:line-through;color:var(--mut)}
li label{flex:1}
li input{width:20px;height:20px}
li .x{background:none;color:var(--mut);padding:4px 8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><div id="clock">…</div></div>
  <div class="card" id="wx">Wetter Schwerin wird geladen …</div>
  <div class="card ticker"><span id="news">Nachrichten werden geladen …</span></div>
  <div class="card" id="quote"></div>
  <div class="card">
    <h2>Aufgaben</h2>
    <div class="add"><input type="text" id="t" placeholder="Neue Aufgabe …"><button id="a">+</button></div>
    <ul id="list"></ul>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function clock(){const d=new Date();$('clock').textContent=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
clock();setInterval(clock,15000);

const WMO={0:'klar',1:'überwiegend klar',2:'teils bewölkt',3:'bedeckt',45:'Nebel',48:'Nebel',51:'leichter Nieselregen',53:'Nieselregen',55:'starker Nieselregen',61:'leichter Regen',63:'Regen',65:'starker Regen',71:'leichter Schneefall',73:'Schneefall',75:'starker Schneefall',80:'Schauer',81:'Schauer',82:'starke Schauer',95:'Gewitter'};
async function wetter(){try{
  const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=53.63&longitude=11.41&current=temperature_2m,weather_code&timezone=auto');
  const c=(await r.json()).current;
  $('wx').textContent='Schwerin: '+Math.round(c.temperature_2m)+' °C, '+(WMO[c.weather_code]||'wechselhaft');
}catch(e){$('wx').textContent='Wetter derzeit nicht verfügbar'}}
async function news(){try{
  const r=await fetch('https://www.tagesschau.de/api2u/homepage/');
  const t=(await r.json()).news.filter(n=>n.title).slice(0,10).map((n,i)=>(i+1)+'. '+n.title);
  $('news').textContent=t.join('   •   ');
}catch(e){$('news').textContent='Nachrichten derzeit nicht verfügbar'}}
wetter();news();setInterval(wetter,1800000);setInterval(news,900000);

const Q=['Ich wollte heute produktiv sein, aber dann kam der Kaffee dazwischen.','Aufgaben erledigen ist wie Abwaschen: Man freut sich erst, wenn es vorbei ist.','Mein To-do-Plan: erst mal eine Liste für die Liste machen.','Wer früher aufsteht, hat länger Zeit, es zu bereuen.','Morgen ist auch noch ein Tag – genau das habe ich gestern auch gesagt.','Multitasking heißt, mehrere Dinge gleichzeitig halb zu machen.','Der frühe Vogel kann mich mal – ich bin Nachtigall.'];
const day=Math.floor(Date.now()/864e5);$('quote').textContent='„'+Q[day%Q.length]+'“';

let todos=[];try{todos=JSON.parse(localStorage.getItem('todos')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('todos',JSON.stringify(todos))}catch(e){}};
function render(){
  const ul=$('list');ul.innerHTML='';
  todos.forEach((t,i)=>{
    const li=document.createElement('li');if(t.done)li.className='done';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.id='c'+i;
    cb.onchange=()=>{t.done=cb.checked;save();render()};
    const lb=document.createElement('label');lb.htmlFor='c'+i;lb.textContent=t.text;
    const x=document.createElement('button');x.className='x';x.textContent='✕';
    x.onclick=()=>{todos.splice(i,1);save();render()};
    li.append(cb,lb,x);ul.append(li);
  });
}
function add(){const v=$('t').value.trim();if(!v)return;todos.push({text:v,done:false});$('t').value='';save();render()}
$('a').onclick=add;$('t').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
render();
</script>
</body>
</html>
